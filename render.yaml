services:
  - type: web
    name: divya-portfolio
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
